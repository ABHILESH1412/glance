# Flatpak manifest for Glance.
#
# This is the build that makes "runs on every major distribution" true: the
# GNOME runtime supplies GTK, libadwaita and libheif, so the versions on the
# host stop mattering. A native build needs GTK 4.14 and libadwaita 1.5 or
# newer; this needs neither.
#
# Building it (flatpak-builder, and the runtime and SDK it names):
#
#   flatpak install flathub org.gnome.Platform//49 org.gnome.Sdk//49 \
#                           org.freedesktop.Sdk.Extension.rust-stable//25.08
#   python3 flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-dir \
#                   build-aux/io.github.abhilesh1412.Glance.yaml
#
# flatpak-cargo-generator.py comes from flatpak/flatpak-builder-tools. It turns
# Cargo.lock into a list of every crate and its checksum, because Flathub builds
# with the network switched off: nothing may be downloaded while building, so
# every dependency has to be declared up front.
#
# cargo-sources.json is generated, not written by hand, and has to be
# regenerated whenever Cargo.lock changes.

id: io.github.abhilesh1412.Glance
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: glance

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # For the GPU path. Without it the SVG renderer and the tone preview fall back
  # to software, which works but is slower.
  - --device=dri
  # A picture is never alone: opening one means showing the rest of its folder
  # along the bottom, stepping through them with the arrow keys, and saving back
  # over the original. The document portal hands over one file at a time, which
  # cannot do any of that. This is the same access every folder-browsing image
  # viewer asks for, and the reason it is asked for.
  - --filesystem=host
  # Live Text's text engine and models are downloaded the first time it is
  # used, after asking, rather than making every download of Glance 41 MB
  # bigger. Pictures are never sent anywhere.
  - --share=network

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/glance/cargo
    # Belt and braces: the build has no network anyway, and this turns a missed
    # dependency into a clear error rather than a hang.
    CARGO_NET_OFFLINE: 'true'

modules:
  # libheif comes from the runtime (1.20 in GNOME 49), along with dav1d for
  # AVIF, so HEIC and AVIF need no module here. Should a future runtime drop it,
  # the fix is a libheif module built before this one rather than a code change.
  # Saving as HEIC needs the runtime's libheif to have an HEVC encoder; where it
  # has none, Export says so rather than failing quietly.

  # Poppler, for PDFs, is not in the runtime, so it is built here. Only its GLib
  # wrapper is needed; everything else is switched off. Boost in particular:
  # Poppler asks for it by default and stops with an error when it is missing,
  # which it is from the GNOME runtime.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_GLIB=ON
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.09.0.tar.xz
        sha256: 8059eadb6805340768f138c465b57f8164c92b4a0773c37ef031ea6c0d987b2e

  # The character maps Poppler needs for Chinese, Japanese and Korean PDFs
  # whose fonts are not embedded. Without them those pages come out blank.
  - name: poppler-data
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  # qpdf, for writing PDFs with a password, and making them
  # smaller: Poppler reads those, but cannot write them. Its own encryption code
  # is used rather than GnuTLS or OpenSSL, so it needs nothing else; zlib and
  # libjpeg come from the runtime. Only the library is kept.
  - name: qpdf
    buildsystem: cmake-ninja
    # qpdf refuses to be configured inside its own source tree.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_IMPLICIT_CRYPTO=OFF
      - -DREQUIRE_CRYPTO_NATIVE=ON
      - -DBUILD_STATIC_LIBS=OFF
      - -DBUILD_DOC=OFF
      - -DINSTALL_EXAMPLES=OFF
      - -DINSTALL_MANUAL=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share
    sources:
      - type: git
        url: https://github.com/qpdf/qpdf.git
        tag: v12.4.2
        commit: 4eba95899886e851cc41d76886483b347612f2a8

  - name: glance
    buildsystem: simple
    build-commands:
      # `make install` never builds (it is the step run as root elsewhere),
      # so the build is its own step. The crates come from cargo-sources.json.
      - make build
      # The Makefile owns the list of what gets installed and where, so the
      # Flatpak and a plain `make install` cannot drift apart.
      - make install PREFIX=/app
    sources:
      # Builds the checkout you are standing in, so cloning and building works
      # without tagging a release first. `target` and `build-dir` are skipped
      # because a Rust build directory is gigabytes and none of it is wanted.
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - .git
      #
      # For a Flathub submission, replace the block above with the release
      # itself. Flathub needs a commit hash rather than a tag: a tag can be
      # moved, a hash cannot, and the build has to be reproducible.
      #
      #  - type: git
      #    url: https://github.com/ABHILESH1412/glance.git
      #    tag: v2.0.0
      #    commit: <the hash that tag points at>
      #
      - cargo-sources.json
