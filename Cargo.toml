[package]
name = "glance"
version = "2.0.0"
edition = "2021"
description = "Look at pictures, and make small changes to them"
authors = ["Abhilesh Singh <sabhilesh260@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ABHILESH1412/glance"
homepage = "https://github.com/ABHILESH1412/glance"
readme = "README.md"
keywords = ["image", "viewer", "gtk", "photo", "editor"]
categories = ["multimedia::images"]
exclude = ["data/screenshots/*", "testdata/*"]

[dependencies]
# Built against the oldest GTK and libadwaita the program actually needs, not
# the newest this machine happens to have. 4.14 and 1.5 are what Ubuntu's
# 24.04 long-term release ships, and asking for more than is used would shut
# out every distribution that has not caught up yet for no gain.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5", "gtk_v4_10"] }
async-channel = "2"

# SVG: pure-Rust vector rendering.
resvg = "0.48"
# HEIC/HEIF + AVIF: wraps the system libheif. Asked for at 1.17, Ubuntu
# 24.04's, like GTK above: by default it wants the newest libheif there is
# (1.23), which the GNOME runtime and most distributions do not have yet.
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
# Camera raw: pure-Rust parsers for ~all common raw formats.
rawler = "0.8"
# PDF: bindings to poppler-glib, the engine GNOME's document viewers use.
# Its glib and cairo versions are the ones gtk4 already brings in. 21.05 for
# telling a search match that wraps onto the next line from two matches; GTK
# 4.14 already needs a newer distribution than that.
poppler-rs = { version = "0.26", features = ["v21_5"] }
# Looking up Poppler's newer calls while running, so a Poppler too old for
# drawing still opens PDFs; already in the tree through poppler-rs.
libc = "0.2"
# Colour management. Pure Rust, and `in_place` spares a full copy of a large
# photograph just to convert it.
moxcms = { version = "0.8", features = ["in_place"] }

# ONNX Runtime, for Live Text. Only the glance-ocr helper uses it, and it is
# loaded from a file at run time (the library is downloaded on first use),
# so nothing of it is built into Glance or needed to build it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-20"] }
# Downloading Live Text's parts: GNOME's own HTTP library, which knows the
# desktop's proxy settings and certificates. And unpacking ONNX Runtime's
# .tgz, already in the tree through the PNG decoder.
soup3 = "0.9"
flate2 = "1"
icns = "0.3"
openjpeg-sys = "1"

[build-dependencies]
# Finding qpdf to link against; already in the tree through GTK's own build.
pkg-config = "0.3"

[dependencies.image]
version = "0.25"
default-features = false
features = ["rayon", "png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "qoi", "pnm", "tga", "exr", "hdr"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Optimised but quick to link: demosaicing a raw file in a debug build takes
# minutes, while fat LTO makes every rebuild a coffee break. This profile is
# for running and testing, not for shipping.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
strip = false
