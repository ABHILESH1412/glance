<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    The symbolic form: one colour, 16 pixels. Every edge is on a whole pixel,
    because a line drawn down the middle of two pixels comes out grey at this
    size and the second card was the first thing to go. The stack is what tells
    it apart from a plain picture icon, so it has to survive.
  -->
  <g fill="currentColor">
    <!-- The card behind, showing along the right and bottom. -->
    <path d="M4 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-1v-1h1a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4z"/>
    <!-- The card in front: a frame with a picture in it. -->
    <path d="M3 4h7a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>
    <circle cx="9" cy="7.25" r="1.25"/>
    <path d="M2 13 4.75 9 6.75 11.25 8.25 10 11 13Z"/>
  </g>
</svg>
